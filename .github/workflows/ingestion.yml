name: Hourly ingestion

# Runs the current-data pipeline every hour so AQICN snapshots (which have no
# history API) accumulate over time in data/raw/*.csv. The CSVs are committed
# back to the repo so each run builds on the previous one.

on:
  schedule:
    - cron: "7 * * * *"   # every hour at minute 7 (UTC)
  workflow_dispatch: {}    # allow manual runs from the Actions tab

permissions:
  contents: write

jobs:
  ingest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -e .

      - name: Run ingestion (current mode)
        env:
          OPENWEATHER_API_KEY: ${{ secrets.OPENWEATHER_API_KEY }}
          AQICN_API_TOKEN: ${{ secrets.AQICN_API_TOKEN }}
          OPENAQ_API_KEY: ${{ secrets.OPENAQ_API_KEY }}
          LOG_LEVEL: INFO
        run: python -m agentweather.pipelines.ingestion_pipeline --mode current

      - name: Commit updated CSVs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f data/raw/*.csv
          if git diff --cached --quiet; then
            echo "No new data to commit"
          else
            git commit -m "data: hourly ingestion $(date -u +%Y-%m-%dT%H:%MZ)"
            git pull --rebase origin main
            git push
          fi
